<div
  x-data="{ ready: false }"
  x-init="import('/plugins/agent_harness/webui/harness-store.js').then(() => { ready = true; return $store.agentHarness.onMount(); })"
  x-destroy="if (ready && $store.agentHarness) { $store.agentHarness.cleanup(); }"
  class="agent-harness-status-chip"
>
  <template x-if="ready && $store.agentHarness && $store.agentHarness.dashboard.show_status_ui !== false">
    <button
      class="agent-harness-toolbar-button"
      :class="{
        'is-running': !!$store.agentHarness.currentRun,
        'needs-attention': $store.agentHarness.hasAttention
      }"
      type="button"
      @click="$store.agentHarness.openObservability()"
      :title="$store.agentHarness.currentRun
        ? 'Open Agent Harness observability: ' + $store.agentHarness.statusButtonLabel()
        : 'Open Agent Harness observability'"
      aria-label="Open Agent Harness observability"
    >
      <span class="material-symbols-outlined" aria-hidden="true">conversion_path</span>
      <span class="agent-harness-toolbar-label">Harness</span>
      <span
        class="agent-harness-toolbar-state"
        x-show="$store.agentHarness.currentRun"
        x-text="$store.agentHarness.statusButtonLabel()"
      ></span>
    </button>
  </template>
</div>
