name: Plugin checks

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install test dependency
        run: python -m pip install "pydantic>=2,<3"

      - name: Arrange Agent Zero plugin layout
        run: |
          mkdir -p "$RUNNER_TEMP/a0/usr/plugins"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/a0/usr/plugins/agent_harness"

      - name: Run Python regression tests
        env:
          A0_TEST_PROJECT_ROOT: ${{ runner.temp }}/a0
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: ${{ runner.temp }}/a0
        run: python -m unittest discover -s tests -v

      - name: Check dashboard JavaScript syntax
        run: |
          node --check webui/harness-store.js
          node --check extensions/webui/surfaces_register/_20_register_agent_harness.js

      - name: Check Python syntax
        run: python -m compileall -q .
